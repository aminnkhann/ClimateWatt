services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: weather_energy
      POSTGRES_USER: weather_user
      POSTGRES_PASSWORD: weather_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/create_tables.sql:/docker-entrypoint-initdb.d/create_tables.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weather_user -d weather_energy"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
