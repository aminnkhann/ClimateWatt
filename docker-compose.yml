services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-weather_energy}
      POSTGRES_USER: ${POSTGRES_USER:-weather_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5442}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/create_tables.sql:/docker-entrypoint-initdb.d/create_tables.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-weather_user} -d ${POSTGRES_DB:-weather_energy}"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    image: apache/airflow:2.10.5-python3.12
    profiles: ["airflow"]
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Build this URL inside the container so credentials with @, :, /, or
      # other reserved URL characters are encoded safely.
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_CMD: >-
        python -c "import os; from urllib.parse import quote; print('postgresql+psycopg2://{}:{}@postgres:5432/{}'.format(quote(os.environ['POSTGRES_USER'], safe=''), quote(os.environ['POSTGRES_PASSWORD'], safe=''), quote(os.environ['POSTGRES_DB'], safe='')), end='')"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:-local-dev-secret}
      AIRFLOW_STAGING_DIR: /tmp/weather-energy-staging
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-weather_energy}
      POSTGRES_USER: ${POSTGRES_USER:-weather_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PRICES_CSV: /opt/airflow/data/input/electricity_prices_sample.csv
      PYTHONPATH: /opt/airflow/src
      _PIP_ADDITIONAL_REQUIREMENTS: -r /opt/airflow/requirements-airflow.txt
    env_file: &airflow-city-env
      - .env.city
    volumes: &airflow-volumes
      - ./dags:/opt/airflow/dags:ro
      - ./src:/opt/airflow/src:ro
      - ./data:/opt/airflow/data
      - ./sql:/opt/airflow/sql:ro
      - ./requirements-airflow.txt:/opt/airflow/requirements-airflow.txt:ro
    command: >
      bash -c "airflow db migrate &&
      (airflow users create
      --username ${AIRFLOW_ADMIN_USER:-admin}
      --password ${AIRFLOW_ADMIN_PASSWORD:-admin}
      --firstname Local --lastname Admin --role Admin
      --email admin@example.com || true)"

  airflow-webserver:
    image: apache/airflow:2.10.5-python3.12
    profiles: ["airflow"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    env_file: *airflow-city-env
    volumes: *airflow-volumes
    ports:
      - "${AIRFLOW_WEBSERVER_PORT:-8080}:8080"
    command: webserver
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type LocalTaskJob --hostname \"$${HOSTNAME}\" || airflow db check"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    image: apache/airflow:2.10.5-python3.12
    profiles: ["airflow"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    env_file: *airflow-city-env
    volumes: *airflow-volumes
    command: scheduler

volumes:
  postgres_data:
